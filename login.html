<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Deep Space Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }
        /* Background decorative elements */
        body::before {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, rgba(99,102,241,0) 70%);
            top: -400px;
            left: -400px;
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, rgba(16,185,129,0) 70%);
            bottom: -300px;
            right: -300px;
            z-index: 0;
            pointer-events: none;
        }
        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            backdrop-filter: blur(16px);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header svg {
            color: var(--indigo);
            margin-bottom: 16px;
        }
        .auth-header h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            color: var(--text-1);
        }
        .auth-header p {
            color: var(--text-3);
            font-size: 0.9rem;
            margin: 0;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-2);
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-2);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-1);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .auth-btn {
            background: var(--indigo);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .auth-btn:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.85rem;
            color: var(--text-3);
        }
        .auth-footer a {
            color: var(--indigo);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .alert {
            display: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
        }
        .alert.error {
            display: block;
            background: rgba(244,63,94,0.1);
            color: #f43f5e;
            border: 1px solid rgba(244,63,94,0.2);
        }
        .alert.success {
            display: block;
            background: rgba(16,185,129,0.1);
            color: #10b981;
            border: 1px solid rgba(16,185,129,0.2);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h1 id="authTitle">Welcome Back</h1>
            <p id="authSubtitle">Enter your credentials to access the dashboard</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="authForm" class="auth-form">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="john@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="auth-btn" id="submitBtn">Sign In</button>
        </form>

        <div class="auth-footer">
            <span id="toggleText">Don't have an account?</span>
            <a id="toggleMode">Sign Up</a>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
