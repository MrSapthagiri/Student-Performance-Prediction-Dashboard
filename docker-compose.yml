version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: student_success_db
    environment:
      POSTGRES_USER: student_admin
      POSTGRES_PASSWORD: student_pass_2024
      POSTGRES_DB: student_success
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
